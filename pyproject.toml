[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "oslt-research-engine"
version = "0.1.0"
description = "Governed multidisciplinary research engine for competing-model evidence synthesis"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Mark Jennings"}]
license = {text = "Proprietary - all rights reserved"}
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "networkx>=3.6,<4",
  "numpy>=2.3,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
  "rich>=15,<16",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.26,<1",
  "uvicorn>=0.48,<1",
]

[project.optional-dependencies]
dev = [
  "setuptools>=82",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
]

[project.scripts]
oslt = "oslt_research.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["oslt_research"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
